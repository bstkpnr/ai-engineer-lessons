[project]
name = "finans-rag"
version = "0.1.0"
description = "Türkçe finans dokümanları üzerinde kaynak gösteren RAG servisi (FastAPI + Qdrant)"
readme = "README.md"
authors = [
    { name = "Muhammet Boğa" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.2",
    "fastembed>=0.9.1",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2",
    "pypdf>=7.0.0",
    "qdrant-client>=1.20.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
finans-rag-ingest = "finans_rag.ingest:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
